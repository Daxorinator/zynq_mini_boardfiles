[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "zynqmini"
version = "0.2.0"
description = "Hardware layer for the ZYNQ MINI board without PYNQ: bitstreams, registers, clocks, DMA buffers, interrupts, overlays"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = []
[project.optional-dependencies]
numpy = ["numpy"]

[tool.setuptools]
packages = ["zynqmini"]
[tool.setuptools.package-data]
zynqmini = ["maps/*.json"]
