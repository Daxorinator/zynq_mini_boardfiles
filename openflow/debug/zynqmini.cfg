# OpenOCD configuration for the ZYNQ MINI's on-board FT232H JTAG port (USB Type-C "JTAG"): ARM DAP + the PL TAP of the XC7Z010.
# Run where the cable is plugged in (needs a libusb/WinUSB driver on the FT232H, e.g. via Zadig on Windows), and let GDB connect over the network:
#     openocd -f zynqmini.cfg -c "bindto 0.0.0.0"
# Then from any machine:  arm-linux-gnueabihf-gdb ... -ex "target extended-remote <host>:3333"   (see gdb_demo.sh)
adapter driver ftdi
ftdi vid_pid 0x0403 0x6014
ftdi channel 0
ftdi layout_init 0x0008 0x000b          ;# TCK = ADBUS0, TDI = ADBUS1, TDO = ADBUS2, TMS = ADBUS3, as on the standard FT232H JTAG wiring
reset_config none                       ;# no SRST/TRST wired; the PS can be reset by writing SLCR PSS_RST_CTRL (see reset-ps below)
transport select jtag
adapter speed 10000

# JTAG chain of the XC7Z010: the PL TAP, then the ARM DAP with the two Cortex-A9 cores. (Written out here instead of sourcing OpenOCD's
# target/zynq_7000.cfg, whose snapshot in some builds has a variable typo in its PL-programming lines.)
set _CHIPNAME zynq
set _TARGETNAME $_CHIPNAME.cpu
jtag newtap zynq_pl bs -irlen 6 -ignore-version -ircapture 0x1 -irmask 0x03 -expected-id 0x03722093
jtag newtap $_CHIPNAME cpu -irlen 4 -ircapture 0x1 -irmask 0xf -expected-id 0x4ba00477
dap create $_CHIPNAME.dap -chain-position $_CHIPNAME.cpu
target create ${_TARGETNAME}0 cortex_a -dap $_CHIPNAME.dap -coreid 0 -dbgbase 0x80090000
target create ${_TARGETNAME}1 cortex_a -dap $_CHIPNAME.dap -coreid 1 -dbgbase 0x80092000
target smp ${_TARGETNAME}0 ${_TARGETNAME}1
${_TARGETNAME}0 configure -event reset-assert-post "cortex_a dbginit"
${_TARGETNAME}1 configure -event reset-assert-post "cortex_a dbginit"

# Reset the whole PS like the reset button: unlock the SLCR and set PSS_RST_CTRL.SOFT_RST. Usage: monitor reset-ps
proc reset-ps {} {
    mww phys 0xf8000008 0xdf0d
    mww phys 0xf8000200 1
}

# Non-intrusive peek at a register through the AHB-AP while the CPUs keep running. Usage: monitor peek 0xf8000258
proc peek {addr} { puts [format "%08x: %08x" $addr [read_memory $addr 32 1]] }
